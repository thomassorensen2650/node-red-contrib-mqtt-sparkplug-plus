<style>
    #sparkplug-input-metric-container-row .red-ui-editableList-header {
        display: flex;
        background: var(--red-ui-tertiary-background);
        padding-right: 75px;
    }
    /* Outer template list: each item fills the full width of the container */
    #node-config-input-templates-container .red-ui-editableList-item-content {
        width: 100%;
        box-sizing: border-box;
    }
    /* Pin the delete (×) button to the top of each tall template row */
    #node-config-input-templates-container > li.red-ui-editableList-item {
        align-items: flex-start !important;
    }
    #node-config-input-templates-container > li.red-ui-editableList-item > .red-ui-editableList-item-remove {
        margin-top: 4px;
    }
    /* Sub-list item content must fill available width so flex children stretch */
    .sp-tpl-metrics-list .red-ui-editableList-item-content,
    .sp-tpl-params-list  .red-ui-editableList-item-content {
        width: 100%;
        box-sizing: border-box;
    }
    /* Keep sub-list delete buttons vertically centred on their single-line row */
    .sp-tpl-metrics-list li.red-ui-editableList-item,
    .sp-tpl-params-list  li.red-ui-editableList-item {
        align-items: center !important;
    }
    .sp-tpl-header-row {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 4px;
    }
    .sp-tpl-header-row .sp-tpl-name {
        flex: 1;
        min-width: 0;
    }
    .sp-tpl-header-row .sp-tpl-version {
        width: 110px;
        flex-shrink: 0;
    }
    .sp-tpl-col-labels {
        display: flex;
        gap: 6px;
        font-size: 0.8em;
        color: var(--red-ui-secondary-text, #777);
        margin-bottom: 2px;
    }
    #mqtt-broker-tab-advanced .red-ui-editableList-item-content {

        padding-right:45px; /* make room for the delete button */

    }

     #mqtt-broker-tab-advanced .red-ui-editableList-border {
        overflow-y: hidden;
     }

    .sparkplug-template-section {
        margin-top: 6px;
        padding: 4px 6px 6px 6px;
        background: var(--red-ui-secondary-background, #f0f0f0);
        border-radius: 4px;

    }
    .sparkplug-template-section-header {
        cursor: pointer;
        font-weight: bold;
        font-size: 0.85em;
        color: var(--red-ui-secondary-text, #555);
        user-select: none;
        padding: 2px 0;
    }
    .sparkplug-template-sublist {
        margin-top: 4px;
    }
    .sparkplug-template-sublist .red-ui-editableList-container {
        background: var(--red-ui-primary-background, #fff);
    }
    /* Sub-list rows: inline layout for name + type columns */
    .sp-sublist-row {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
        box-sizing: border-box;
    }
    .sp-sublist-row .sp-col-name {
        flex: 1;
        min-width: 0;
    }
    .sp-sublist-row .sp-col-type {
        width: 110px;
        flex-shrink: 0;
    }
    .sp-sublist-row .sp-col-value {
        width: 100px;
        flex-shrink: 0;
    }
    .sp-sublist-empty {
        font-size: 0.85em;
        color: var(--red-ui-secondary-text, #999);
        padding: 4px 2px;
        font-style: italic;
    }
</style>

<script type="text/html" data-template-name="mqtt-sparkplug-broker">
    <div class="form-row">
        <label for="node-config-input-name"><i class="fa fa-tag"></i> <span data-i18n="mqtt-sparkplug-plus.label.name"></span></label>
        <input type="text" id="node-config-input-name" data-i18n="[placeholder]mqtt-sparkplug-plus.label.name">
    </div>
    <div class="form-row">
        <ul style="min-width: 600px; margin-bottom: 20px;" id="node-config-mqtt-broker-tabs"></ul>
    </div>
    <div id="node-config-mqtt-broker-tabs-content" style="min-height:150px;">
        <div id="mqtt-broker-tab-connection" style="display:none">
            <div class="form-row node-input-broker">
                <label for="node-config-input-broker"><i class="fa fa-globe"></i> <span data-i18n="mqtt-sparkplug-plus.label.broker"></span></label>
                <input type="text" id="node-config-input-broker" style="width: calc(100% - 300px);" data-i18n="[placeholder]mqtt-sparkplug-plus.label.example">
                <label for="node-config-input-port" style="margin-left:20px; width:43px; "> <span data-i18n="mqtt-sparkplug-plus.label.port"></span></label>
                <input type="text" id="node-config-input-port" data-i18n="[placeholder]mqtt-sparkplug-plus.label.port" style="width:55px">
            </div>
            <div class="form-row" style="height: 34px;">
                <input type="checkbox" id="node-config-input-usetls" style="height: 34px; margin: 0 5px 0 104px; display: inline-block; width: auto; vertical-align: top;">
                <label for="node-config-input-usetls" style="width: 100px; line-height: 34px;"><span data-i18n="mqtt-sparkplug-plus.label.use-tls"></span></label>
                <span id="node-config-row-tls" class="hide"><input style="width: 320px;" type="text" id="node-config-input-tls"></span>
            </div>
            <div class="form-row">
                <label for="node-config-input-user"><i class="fa fa-user"></i> <span data-i18n="mqtt-sparkplug-plus.label.username"></span></label>
                <input type="text" id="node-config-input-user" data-i18n="[placeholder]mqtt-sparkplug-plus.placeholder.username">
            </div>
            <div class="form-row">
                <label for="node-config-input-password"><i class="fa fa-lock"></i> <span data-i18n="mqtt-sparkplug-plus.label.password"></span></label>
                <input type="password" id="node-config-input-password">
            </div>
            <div class="form-row">
                <label for="node-config-input-protocolVersion"><i class="fa fa-cog"></i> <span data-i18n="mqtt-sparkplug-plus.label.protocolVersion"></span></label>
                <select id="node-config-input-protocolVersion" style="width:70%;">
                    <option value="4" data-i18n="mqtt-sparkplug-plus.label.protocolVersion4"></option>
                    <option value="5" data-i18n="mqtt-sparkplug-plus.label.protocolVersion5"></option>
                </select>
            </div>
            <div class="form-row mqtt5" style="display:none;">
                <label for="node-config-input-userProps"><i class="fa fa-list"></i> <span data-i18n="mqtt-sparkplug-plus.label.userProperties"></span></label>
                <input type="text" id="node-config-input-userProps" style="width:70%;">
            </div>
            <div class="form-tips mqtt5" id="node-mqtt5-session-note" style="display:none;">
                <i class="fa fa-info-circle"></i> <span data-i18n="mqtt-sparkplug-plus.tip.mqtt5Session"></span>
            </div>
            <div class="form-row">
                <label for="node-config-input-clientid"><i class="fa fa-tag"></i> <span data-i18n="mqtt-sparkplug-plus.label.clientid"></span></label>
                <input type="text" id="node-config-input-clientid" data-i18n="[placeholder]mqtt-sparkplug-plus.placeholder.clientid">
            </div>
            <div class="form-row">
                <label for="node-config-input-keepalive"><i class="fa fa-heartbeat"></i> <span data-i18n="mqtt-sparkplug-plus.label.keepalive"></span></label>
                <input type="number" min="0" id="node-config-input-keepalive" style="width: 100px">
            </div>
            <div class="form-row">
                <label for="node-config-input-manualEoNBirth" style="height: 34px; margin: 0 5px 0 104px; display: inline-block; width: auto; vertical-align: top;">
                    <input type="checkbox" id="node-config-input-manualEoNBirth" style="display:inline-block; width:22px; vertical-align:top;"><span data-i18n="mqtt-sparkplug-plus.label.manualEoNBirth"></span>
                </label>
            </div>
        </div>
        <div id="mqtt-broker-tab-advanced" style="display:none">
            <div class="form-row node-config-input-templates-container-row" style="margin-bottom: 0px;">
                <label><i class="fa fa-cubes"></i> <span data-i18n="mqtt-sparkplug-plus.label.templates"></span></label>
                <span style="font-size:0.85em; color: var(--red-ui-secondary-text, #777);" data-i18n="mqtt-sparkplug-plus.tip.templates"></span>
            </div>
            <div class="form-row node-config-input-templates-container-row" id="node-config-input-templates-container-row">
                <ol id="node-config-input-templates-container"></ol>
            </div>
        </div>
         <div id="mqtt-broker-tab-sparkplug" style="display:none">
            <div class="form-row">
                <label for="node-config-input-eonName"><i class="fa fa-tag"></i> <span data-i18n="mqtt-sparkplug-plus.label.name"></span></label>
                <input type="text" id="node-config-input-eonName" data-i18n="[placeholder]mqtt-sparkplug-plus.placeholder.eonname">
            </div>

            <div class="form-row">
                <label for="node-config-input-deviceGroup"><i class="fa fa-tasks"></i> <span>Group</span></label>
                <input type="text" id="node-config-input-deviceGroup" data-i18n="[placeholder]Sparkplug Devices">
            </div>

            <!-- Add UI for compress output -->
            <div class="form-row">
                <label for="node-config-input-compressAlgorithm"><i class="fa fa-compress"></i> Compress</label>
                <select id="node-config-input-compressAlgorithm">
                    <option value="">No</option>
                    <option value="DEFLATE">Deflate</option>
                    <option value="GZIP">Gzip</option>
                </select>
            </div>

            <!-- UI for Alias Metrics-->
            <div class="form-row">
            <label for="node-config-input-aliasMetrics" style="width:70%">
                <input type="checkbox" id="node-config-input-aliasMetrics" style="display:inline-block; width:22px; vertical-align:top;"><span data-i18n="mqtt-sparkplug-plus.label.aliasMetrics"></span>
            </label>
            </div>
            <!-- Add UI for Store forward -->
            <div class="form-row">
                <label for="node-config-input-enableStoreForward" style="width:70%">
                    <input type="checkbox" id="node-config-input-enableStoreForward" style="display:inline-block; width:22px; vertical-align:top;"><span data-i18n="mqtt-sparkplug-plus.label.storeforward"></span>
                </label>
                </div>
            <!-- Primary Host ID is independent of Store Forward: it governs whether
                 NBIRTH waits for a host, not whether data is buffered. -->
            <div class="form-row" id="node-primaryhost-line">
                <label for="node-config-input-primaryScada"><i class="fa fa-desktop"></i> <span data-i18n="mqtt-sparkplug-plus.label.primaryScada"></span></label>
                <input id="node-config-input-primaryScada" type="text" data-i18n="[placeholder]mqtt-sparkplug-plus.placeholder.primaryScada">
            </div>
            <div class="form-tips" id="node-primaryhost-warning" style="display:none;">
                <i class="fa fa-warning"></i> <span data-i18n="mqtt-sparkplug-plus.tip.primaryScadaWait"></span>
            </div>
            <div class="form-tips" id="node-storeforward-warning" style="display:none;">
                <i class="fa fa-warning"></i> <span data-i18n="mqtt-sparkplug-plus.tip.storeforwardNoHost"></span>
            </div>
        </div>
    </div>
</script>

<script type="text/javascript">
(function() {

    var primitiveDataTypes = ["Int8", "Int16", "Int32", "Int64", "UInt8", "UInt16", "UInt32", "UInt64", "Float", "Double", "Boolean", "DateTime", "UUID", "DataSet", "Bytes", "String", "Unknown"];

    /**
     * Collect all template definitions currently entered in the outer editable list.
     * Returns an array of JSON strings, one per template.
     */
    function geTemplateList() {
        var _templates = [];
        var items = $("#node-config-input-templates-container").editableList("items");
        items.each(function() {
            var item = $(this);
            var name    = item.find(".sp-tpl-name").val().trim();
            var version = item.find(".sp-tpl-version").val().trim();

            if (!name) return; // skip empty rows

            // Collect metrics sub-list
            var metrics = [];
            item.find(".sp-tpl-metrics-list").editableList("items").each(function() {
                var mName = $(this).find(".sp-tpl-metric-name").val().trim();
                var mType = $(this).find(".sp-tpl-metric-type").val();
                if (mName) {
                    metrics.push({ name: mName, type: mType });
                }
            });

            // Collect parameters sub-list
            var parameters = [];
            item.find(".sp-tpl-params-list").editableList("items").each(function() {
                var pName  = $(this).find(".sp-tpl-param-name").val().trim();
                var pType  = $(this).find(".sp-tpl-param-type").val();
                var pValue = $(this).find(".sp-tpl-param-value").val().trim();
                if (pName) {
                    var p = { name: pName, type: pType };
                    if (pValue !== "") p.value = pValue;
                    parameters.push(p);
                }
            });

            var tpl = {
                name: name,
                type: "Template",
                value: {
                    version: version,
                    isDefinition: true,
                    metrics: metrics,
                    parameters: parameters
                }
            };
            _templates.push(JSON.stringify(tpl));
        });
        return _templates;
    }

    /**
     * Build a <select> element populated with primitive types plus optionally
     * other defined template names (excluding the one being edited, to prevent cycles).
     */
    function buildTypeSelect(cssClass, selectedValue, extraTemplateNames) {
        var sel = $('<select/>', { class: cssClass, style: "width:110px; margin-left:4px;" });
        var g0 = $('<optgroup/>', { label: "Datatypes" }).appendTo(sel);
        primitiveDataTypes.forEach(function(d) {
            $('<option/>').val(d).text(d).prop('selected', d === selectedValue).appendTo(g0);
        });
        if (extraTemplateNames && extraTemplateNames.length) {
            var g1 = $('<optgroup/>', { label: "Templates" }).appendTo(sel);
            extraTemplateNames.forEach(function(n) {
                $('<option/>').val(n).text(n).prop('selected', n === selectedValue).appendTo(g1);
            });
        }
        return sel;
    }

    /**
     * Return template names currently defined in the outer list (used to populate
     * the type dropdown for nested template references inside a template's metrics).
     */
    function getCurrentTemplateNames() {
        var names = [];
        $("#node-config-input-templates-container").editableList("items").each(function() {
            var n = $(this).find(".sp-tpl-name").val().trim();
            if (n) names.push(n);
        });
        return names;
    }

    RED.nodes.registerType('mqtt-sparkplug-broker',{
        category: 'config',
        defaults: {
            name: {value:"" },
            deviceGroup : {value:"",  validate :x => /^[^/+#]*$/.test(x) },
            eonName : {value:"",  validate :x => /^[^/+#]*$/.test(x) },
            broker: {value:"",required:true},
            port: {value:1883,required:false,validate:RED.validators.number(true)},
            tls: {type:"tls-config",required: false},
            clientid: {value:""},
            usetls: {value: false},
            verifyservercert: { value: false},
            protocolVersion: { value: 4},
            // MQTT 5.0 only. CONNECT user properties, as a JSON object.
            userProps: {value: ""},
            keepalive: {value:60,validate:RED.validators.number()},
            cleansession: {value: true},
            enableStoreForward: {value: false},
            compressAlgorithm : {value: false},
            aliasMetrics : {value: false},
            useTemplates : {value: true},
            templates : {value: []},
            manualEoNBirth : {value: false},

            // Optional on its own, but required by Store Forward - with buffering on
            // and no host the status is pinned OFFLINE and data buffers forever.
            // Whenever a value is given it must be a legal Sparkplug Host ID.
            primaryScada: {value:"",  validate : x => $("#node-config-input-enableStoreForward").is(":checked") ? /^[^/+#]+$/.test(x) : (!x || /^[^/+#]+$/.test(x)) },
        },
        credentials: {
            user: {type:"text"},
            password: {type: "password"}
        },
        label: function() {
            if (this.name) {
                return this.name;
            }
            var b = this.broker;
            if (!b) { b = "undefined"; }
            var lab = "";
            lab = (this.clientid?this.clientid+"@":"")+b;
            if (b.indexOf("://") === -1){
                if (!this.port){ lab = lab + ":1883"; }
                else { lab = lab + ":" + this.port; }
            }
            return lab;
        },
        oneditprepare: function () {
            var tabs = RED.tabs.create({
                id: "node-config-mqtt-broker-tabs",
                onchange: function(tab) {
                    $("#node-config-mqtt-broker-tabs-content").children().hide();
                    $("#" + tab.id).show();
                }
            });
            tabs.addTab({
                id: "mqtt-broker-tab-connection",
                label: this._("mqtt-sparkplug-plus.tabs-label.connection"),
                iconClass: "fa fa-server"
            });

            tabs.addTab({
                id: "mqtt-broker-tab-sparkplug",
                label: this._("mqtt-sparkplug-plus.tabs-label.sparkplug"),
                iconClass: "fa fa-plug"
            });

            tabs.addTab({
                id: "mqtt-broker-tab-advanced",
                label: this._("mqtt-sparkplug-plus.tabs-label.advanced"),
                iconClass: "fa fa-cubes"
            });

            // ── Template Definitions Editor ──────────────────────────────────────
            var templateList = $("#node-config-input-templates-container").editableList({
                header: $("<div>", { style: "display:flex; gap:6px;" }).append(
                    $("<div>", { style: "flex:1; font-weight:bold;" }).text("Name"),
                    $("<div>", { style: "width:110px; font-weight:bold;" }).text("Version")
                ),
                addButton: this._("mqtt-sparkplug-plus.label.add-template") || "Add Template",
                removable: true,
                height: "auto",
                sortable: true,
                addItem: function(container, i, opt) {

                    // ── Header row: name + version (side by side) ─────────────
                    var headerRow = $("<div/>", { class: "sp-tpl-header-row" }).appendTo(container);

                    $("<input/>", {
                        class: "sp-tpl-name",
                        type: "text",
                        placeholder: "TemplateName"
                    }).val(opt.name || "").appendTo(headerRow);

                    $("<input/>", {
                        class: "sp-tpl-version",
                        type: "text",
                        placeholder: "1.0.0"
                    }).val((opt.value && opt.value.version) || "").appendTo(headerRow);

                    // ── Metrics sub-section (expanded by default) ─────────────
                    var metricsSection = $("<div/>", { class: "sparkplug-template-section" }).appendTo(container);

                    var metricsHeader = $("<div/>", {
                        class: "sparkplug-template-section-header",
                        html: '<i class="fa fa-caret-down" style="width:10px;"></i> Metrics'
                    }).appendTo(metricsSection);

                    var metricsSubDiv = $("<div/>", { class: "sparkplug-template-sublist" }).appendTo(metricsSection);

                    metricsHeader.on("click", function() {
                        metricsSubDiv.toggle();
                        $(this).find("i").toggleClass("fa-caret-down fa-caret-right");
                    });

                    // Column labels inside the metrics sub-section
                    $("<div/>", { class: "sp-tpl-col-labels" }).append(
                        $("<span>", { style: "flex:1" }).text("Metric name"),
                        $("<span>", { style: "width:110px" }).text("Type")
                    ).appendTo(metricsSubDiv);

                    var metricsOl = $("<ol/>", { class: "sp-tpl-metrics-list" }).appendTo(metricsSubDiv);

                    metricsOl.editableList({
                        addButton: "Add Metric",
                        removable: true,
                        height: '200px',
                        addItem: function(mc, mi, mopt) {
                            var mRow = $("<div/>", { class: "sp-sublist-row" }).appendTo(mc);
                            $("<input/>", {
                                class: "sp-tpl-metric-name sp-col-name",
                                type: "text",
                                placeholder: "metricName"
                            }).val(mopt.name || "").appendTo(mRow);

                            var otherTemplates = getCurrentTemplateNames().filter(function(n) {
                                return n !== container.find(".sp-tpl-name").val();
                            });
                            buildTypeSelect("sp-tpl-metric-type sp-col-type", mopt.type || "Int32", otherTemplates).appendTo(mRow);
                        }
                    });

                    // Populate metrics from saved data
                    var savedMetrics = (opt.value && opt.value.metrics) || [];
                    savedMetrics.forEach(function(m) {
                        metricsOl.editableList("addItem", m);
                    });

                    // ── Parameters sub-section (collapsed by default) ─────────
                    var paramsSection = $("<div/>", { class: "sparkplug-template-section" }).appendTo(container);

                    var savedParams = (opt.value && opt.value.parameters) || [];
                    var paramsExpanded = savedParams.length > 0;
                    var paramsHeader = $("<div/>", {
                        class: "sparkplug-template-section-header",
                        html: '<i class="fa ' + (paramsExpanded ? "fa-caret-down" : "fa-caret-right") + '" style="width:10px;"></i> Parameters'
                    }).appendTo(paramsSection);

                    var paramsSubDiv = $("<div/>", {
                        class: "sparkplug-template-sublist",
                        style: paramsExpanded ? "" : "display:none;"
                    }).appendTo(paramsSection);

                    paramsHeader.on("click", function() {
                        paramsSubDiv.toggle();
                        $(this).find("i").toggleClass("fa-caret-down fa-caret-right");
                    });

                    // Column labels inside the parameters sub-section
                    $("<div/>", { class: "sp-tpl-col-labels" }).append(
                        $("<span>", { style: "flex:1" }).text("Parameter name"),
                        $("<span>", { style: "width:110px" }).text("Type"),
                        $("<span>", { style: "width:100px" }).text("Default value")
                    ).appendTo(paramsSubDiv);

                    var paramsOl = $("<ol/>", { class: "sp-tpl-params-list" }).appendTo(paramsSubDiv);

                    paramsOl.editableList({
                        addButton: "Add Parameter",
                        removable: true,
                        height: '200px',
                        sortable: true,
                        addItem: function(pc, pi, popt) {
                            var pRow = $("<div/>", { class: "sp-sublist-row" }).appendTo(pc);
                            $("<input/>", {
                                class: "sp-tpl-param-name sp-col-name",
                                style: 'min-width:150px;',
                                type: "text",
                                placeholder: "paramName"
                            }).val(popt.name || "").appendTo(pRow);

                            buildTypeSelect("sp-tpl-param-type sp-col-type", popt.type || "String", []).appendTo(pRow);

                            $("<input/>", {
                                class: "sp-tpl-param-value sp-col-value",
                                type: "text",
                                placeholder: "default value"
                            }).val(popt.value !== undefined ? popt.value : "").appendTo(pRow);
                        }
                    });

                    // Populate parameters from saved data
                    var savedParams = (opt.value && opt.value.parameters) || [];
                    savedParams.forEach(function(p) {
                        paramsOl.editableList("addItem", p);
                    });
                }
            });

            // Load existing templates
            var savedTemplates = this.templates || [];
            savedTemplates.forEach(function(t) {
                try {
                    var parsed = typeof t === "string" ? JSON.parse(t) : t;
                    templateList.editableList("addItem", parsed);
                } catch(e) {
                    // skip malformed entries
                }
            });

            // ── Connection tab setup ──────────────────────────────────────────
            this.cleansession = true;

            // Primary Host ID and Store Forward are independent settings. Setting a
            // host makes the Edge Node withhold NBIRTH until that host publishes an
            // ONLINE STATE message; Store Forward only decides whether data is
            // buffered meanwhile. Run once on open as well as on change - Node-RED
            // populates the inputs before oneditprepare, so a change-only handler
            // leaves a saved config showing the wrong hints.
            function updatePrimaryHostHints() {
                var phid = ($("#node-config-input-primaryScada").val() || "").trim();
                var sf = $("#node-config-input-enableStoreForward").is(":checked");
                $("#node-primaryhost-warning").toggle(!!phid);
                $("#node-storeforward-warning").toggle(sf && !phid);
            }
            updatePrimaryHostHints();
            $("#node-config-input-primaryScada").on('input change', updatePrimaryHostHints);
            $("#node-config-input-enableStoreForward").on('change', updatePrimaryHostHints);

            function updateTLSOptions() {
                if ($("#node-config-input-usetls").is(':checked')) {
                    $("#node-config-row-tls").show();
                } else {
                    $("#node-config-row-tls").hide();
                }
            }
            updateTLSOptions();
            $("#node-config-input-usetls").on("click",function() {
                updateTLSOptions();
            });
            function updatePortEntry(){
                var disabled = $("#node-config-input-port").prop("disabled");
                if ($("#node-config-input-broker").val().indexOf("://") === -1){
                    if (disabled){
                        $("#node-config-input-port").prop("disabled", false);
                    }
                }
                else {
                    if (!disabled){
                        $("#node-config-input-port").prop("disabled", true);
                    }
                }
            }
            $("#node-config-input-broker").on("change", function() {
                updatePortEntry();
            });
            $("#node-config-input-broker").on( "keyup", function() {
                updatePortEntry();
            });
            setTimeout(updatePortEntry,50);

            // User properties are an MQTT 5.0 feature, so the row only appears when
            // 5.0 is selected - as does the note explaining that Clean Start and the
            // Session Expiry Interval are fixed by the Sparkplug specification and
            // therefore not offered as settings.
            // RED._ returns the key itself when the catalog has no entry, so a wrong
            // key renders as literal text in the editor - "common.label.none" was
            // showing up as the option label. Fall back to plain text instead.
            let translate = function(key, fallback) {
                let translated = RED._(key);
                return translated === key ? fallback : translated;
            };

            $("#node-config-input-userProps").typedInput({
                default: this.userProps ? "json" : "none",
                types: [
                    {
                        value: "none",
                        label: translate("mqtt-sparkplug-plus.label.none", "none"),
                        hasValue: false
                    },
                    "json"
                ]
            });
            if (this.userProps) {
                $("#node-config-input-userProps").typedInput("value", this.userProps);
            }

            $("#node-config-input-protocolVersion").on("change", function() {
                let isV5 = $("#node-config-input-protocolVersion").val() === "5";
                $(".mqtt5").toggle(isV5);
            });
            $("#node-config-input-protocolVersion").val(this.protocolVersion || 4);
            setTimeout(function() {
                $("#node-config-input-protocolVersion").trigger("change");
            },50);
        },
        oneditsave: function() {
            if (!$("#node-config-input-usetls").is(':checked')) {
                $("#node-config-input-tls").val("");
            }
            // Only meaningful for 5.0, and "none" means none - so anything else is
            // stored empty rather than left behind from an earlier edit.
            let keepUserProps = $("#node-config-input-protocolVersion").val() === "5"
                && $("#node-config-input-userProps").typedInput("type") === "json";
            this.userProps = keepUserProps ? $("#node-config-input-userProps").typedInput("value") : "";
            this.templates = geTemplateList();
        }
    });
})();
</script>

<script type="text/javascript">
(function() {

    /**
    * Function that returns a list of configured Metrics
    * @return   {Object} A object with all configured metrics.
    */
    function getMetricsList() {
        var _metrics = {};
        var metrics = $("#sparkplug-input-metric-container").editableList("items");
        metrics.each(function(i) {
            var item = $(this);
            var name = item.find(".sparkplug-input-metric-name").val();
            var dt = item.find(".sparkplug-input-metric-dateType option:selected").val();

            if (name) {
                _metrics[name] = { dataType : dt};
            }
        });
        return _metrics;
    }

    var primitiveTypes = ["Int8", "Int16", "Int32", "Int64", "UInt8", "UInt16", "UInt32", "UInt64", "Float", "Double", "Boolean", "DateTime", "UUID", "DataSet", "Bytes", "String", "Unknown"];

    RED.nodes.registerType('mqtt sparkplug device',{
        category: 'network',
        defaults: {
            name: {value:"",  validate :x => /^[^/+#]*$/.test(x) },
            metrics: {value:{}, required:true },
            broker: {type:"mqtt-sparkplug-broker", required:true},
            birthImmediately: {value: false},
            bufferDevice: {value: false}
        },

        color:"#2181a6",
        inputs:1,
        outputs:1,
        icon: "sparkplug.svg",
        inputLabels: "DDATA Details",
        outputLabels: "DCMD",
        align: "right",
        label: function() {
            return this.name||"Sparkplug Device";
        },
        oneditprepare: function() {

            var that = this;

            // Resolve broker connection BEFORE the editableList is set up so that
            // the addItem callback can read brokerConn.templates.
            if (this.broker) {
                this.brokerConn = RED.nodes.node(this.broker);
            }

            var tabs = RED.tabs.create({
                id: "node-mqtt-device-tabs",
                onchange: function(tab) {
                    $("#node-mqtt-device-tabs-content").children().hide();
                    $("#" + tab.id).show();
                }
            });
            tabs.addTab({
                id: "mqtt-device-tab-metrics",
                label: this._("mqtt-sparkplug-plus.tabs-label.metrics"),
                iconClass: "fa fa-cubes",
            });
            tabs.addTab({
                id: "mqtt-device-tab-advanced",
                label: this._("mqtt-sparkplug-plus.tabs-label.advanced"),
                iconClass: "fa fa-cog"
            });

            // Collect template names from the broker config for the type dropdown
            var templateNames = [];
            if (that.brokerConn && that.brokerConn.templates) {
                that.brokerConn.templates.forEach(function(t) {
                    try {
                        var tv = typeof t === "string" ? JSON.parse(t) : t;
                        if (tv && tv.name) {
                            templateNames.push(tv.name);
                        }
                    } catch(e) { /* skip malformed */ }
                });
            }

            // Setup metrics list
            var metricsList = $("#sparkplug-input-metric-container").editableList( {
                header: $("<div>").append($.parseHTML("<div style='width:80%; display: inline-grid'>Name</div><div style='display: inline-grid'>Type</div>")),
                addButton: "add",
                sortable: true,
                removable: true,
                height: 300,
                addItem: function(container,i,opt) {

                    var row = $("<div/>").addClass("sparkplug-input-metric").appendTo(container);
                    var fmoduleSpan = $("<span>").appendTo(row);
                    $("<input/>", {
                        class: "sparkplug-input-metric-name",
                        placeholder: "Metric Name",
                        type: "text"
                    }).appendTo(fmoduleSpan).val(opt.name || "");

                    var selectField = $('<select/>',{
                        style:"width:110px; margin-left: 5px; text-align: center;",
                        class : "sparkplug-input-metric-dateType"
                    }).appendTo(row);

                    var group0 = $('<optgroup/>', { label: "Datatypes" }).appendTo(selectField);

                    primitiveTypes.forEach(function(d) {
                        var option = $("<option></option>").val(d).text(d);
                        group0.append(option);
                        if (d === opt.dataType || (Object.keys(opt).length === 0 && d === "Int32")) {
                            option.attr('selected','selected');
                        }
                    });

                    // Templates optgroup — names come directly from the broker config,
                    // no underscore prefix needed; the name IS the dataType reference.
                    if (templateNames.length > 0) {
                        var group1 = $('<optgroup/>', { label: "Templates" }).appendTo(selectField);
                        templateNames.forEach(function(tName) {
                            var option = $("<option></option>").val(tName).text(tName);
                            if (tName === opt.dataType) {
                                option.attr('selected','selected');
                            }
                            group1.append(option);
                        });
                    }
                }
            });

            var metrics = this.metrics || {};
            for (const [key, value] of Object.entries(metrics)) {
                value["name"] = key;
                metricsList.editableList('addItem', value);
            }
        },
        oneditsave: function() {
            var node = this;
            node.metrics = getMetricsList();
        },

        labelStyle: function() {
            return this.name?"node_label_italic":"";
        }
    });
})();
</script>
