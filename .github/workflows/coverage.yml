name: Test Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Mosquitto MQTT broker
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto

      - name: Start Mosquitto with anonymous access
        run: |
          mosquitto -c .github/workflows/mosquitto.conf &
          sleep 2

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm run coverage
        env:
          TEST_BROKER: mqtt://localhost:1883

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          repo_token: ${{ secrets.CODECOV_TOKEN }}