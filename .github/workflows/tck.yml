name: Sparkplug TCK

# Runs the Eclipse Sparkplug TCK (Edge Node profile) against the nodes in this
# repo. The TCK is normally driven from a Nuxt web console, but its control
# plane is plain MQTT, so test/tck/run-tck.js drives it headlessly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Pinned: the TCK's utility clients hardcode tcp://localhost:1883, so the
  # broker must own that port. Nothing else in this workflow binds it.
  SPARKPLUG_REF: v3.0.0
  HIVEMQ_VERSION: '2024.9'

jobs:
  tck:
    name: Edge Node profile
    runs-on: ubuntu-latest
    # Backstop for the whole job. GitHub's default is 360 minutes, so without
    # this a stalled TCK run burns six hours of runner time before anyone finds
    # out - which is exactly what happened before. The per-step timeouts below
    # should always fire first; this only catches a stall they do not cover.
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout Sparkplug TCK
        uses: actions/checkout@v4
        with:
          repository: eclipse-sparkplug/sparkplug
          ref: ${{ env.SPARKPLUG_REF }}
          path: sparkplug-tck

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Cache HiveMQ download
        uses: actions/cache@v4
        with:
          path: .tck-broker/cache
          key: hivemq-ce-${{ env.HIVEMQ_VERSION }}

      # The tck/ directory ships a gradlew without its wrapper jar, so the root
      # wrapper with -p tck is the only way to build it.
      - name: Build TCK HiveMQ extension
        timeout-minutes: 15
        run: ./gradlew -p tck hivemqExtensionZip --no-daemon
        working-directory: sparkplug-tck

      # One broker per test, started and torn down by the orchestrator. The TCK's
      # Monitor keeps per-edge-node state for the whole broker session and never
      # clears it, so sharing one broker across all five tests lets earlier tests
      # decide later ones: measured over ten runs of unchanged code that produced
      # 1/5 to 4/5 passing at random, and never 5/5. Isolated, it is repeatable.
      #
      # Deliberately longer than the script's own TCK_RUN_TIMEOUT_MS watchdog, so
      # on a stall the script wins the race, writes partial results and exits 124.
      # A step timeout - unlike a job timeout - still lets the `if: always()`
      # upload below run, so the diagnostics survive either way.
      - name: Run Sparkplug TCK
        timeout-minutes: 40
        run: test/tck/run-tck-isolated.sh sparkplug-tck
        env:
          TCK_BROKER: mqtt://localhost:1883
          TCK_VERBOSE: '1'
          TCK_RUN_TIMEOUT_MS: '900000'
          # Roughly half of first attempts lose the TCK's self-connect deadlock
          # (see test/tck/README.md). It is not ours to fix and a retry has always
          # cleared it, but two attempts leaves a real chance of a test losing
          # both. A dead attempt now costs ~10s, so the third is cheap insurance.
          TCK_ATTEMPTS: '3'

      - name: Upload TCK results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tck-results
          path: |
            tck-results/
            tck-logs/
            .tck-broker/hivemq-ce-*/bin/SparkplugTCKResults.log
          if-no-files-found: warn
